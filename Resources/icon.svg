<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD93B"/>
      <stop offset="0.5" stop-color="#FF8C1A"/>
      <stop offset="1" stop-color="#E02B2B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD93B"/>
      <stop offset="0.55" stop-color="#FF8C1A"/>
      <stop offset="1" stop-color="#E02B2B"/>
    </linearGradient>
    <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9CBB8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1B1022"/>
  <circle cx="256" cy="256" r="190" fill="url(#sun)"/>

  <!-- horizontal sunset slits -->
  <g fill="#1B1022">
    <rect x="60" y="360" width="392" height="8"/>
    <rect x="60" y="388" width="392" height="12"/>
    <rect x="60" y="420" width="392" height="16"/>
  </g>

  <!-- tractor beam -->
  <path d="M214 282 L150 440 L362 440 L298 282 Z" fill="url(#beam)"/>

  <!-- waveform inside the beam -->
  <g fill="url(#bar)" stroke="#1B1022" stroke-width="4">
    <rect x="190" y="320" width="14" height="40" rx="7" transform="translate(0 0)"/>
    <rect x="212" y="320" width="14" height="76" rx="7"/>
    <rect x="234" y="320" width="14" height="104" rx="7"/>
    <rect x="256" y="320" width="14" height="60" rx="7"/>
    <rect x="278" y="320" width="14" height="90" rx="7"/>
    <rect x="300" y="320" width="14" height="52" rx="7"/>
    <rect x="322" y="320" width="14" height="30" rx="7"/>
  </g>

  <!-- UFO -->
  <g stroke="#1B1022" stroke-width="6" stroke-linejoin="round">
    <!-- glass dome -->
    <path d="M190 232 C190 160 322 160 322 232 Z" fill="#FFB52E"/>
    <path d="M212 220 C214 188 244 176 262 178" fill="none" stroke="#FFF3C4" stroke-width="8" stroke-linecap="round"/>
    <!-- saucer body -->
    <ellipse cx="256" cy="244" rx="168" ry="48" fill="url(#saucer)"/>
    <!-- red band -->
    <path d="M110 252 Q256 316 402 252 Q256 340 110 252 Z" fill="#E02B2B"/>
  </g>
  <!-- lights -->
  <g stroke="#1B1022" stroke-width="4">
    <circle cx="150" cy="252" r="11" fill="#FFD93B"/>
    <circle cx="203" cy="270" r="11" fill="#FF8C1A"/>
    <circle cx="256" cy="276" r="11" fill="#E02B2B"/>
    <circle cx="309" cy="270" r="11" fill="#FF8C1A"/>
    <circle cx="362" cy="252" r="11" fill="#FFD93B"/>
  </g>
</svg>
